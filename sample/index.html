function SendLoginRequest(event)
{	
	event.preventDefault();
	var username = document.getElementById("username").value;
	var password = document.getElementById("password").value;
	var request = new XMLHttpRequest();
	request.open("POST","login.php",true);
	request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
	request.onreadystatechange= function ()
	{
		
		if ((this.readyState == 4)&&(this.status == 200))
		{
			HandleLoginResponse(this.responseText);
		

		}		
	}
	request.send("type=login&username="+username+"&password="+password);
}
function SendLogoutRequest(event)
{	
	event.preventDefault();
	var username = cookie.username;
	var ID = parseInt(cookie.sessionKey);
	var request = new XMLHttpRequest();
	request.open("POST","login.php",true);
	request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
	request.onreadystatechange= function ()
	{
				
		if ((this.readyState == 4)&&(this.status == 200))
		{
			handleLogoutResponse(this.responseText);


		}		
	}
	request.send("type=logout&username="+username+"&sessionKey="+ID);
}
function SendValidateRequest(event)
{

			handleValidateResponse(this.responseText);
