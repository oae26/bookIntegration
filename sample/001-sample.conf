<VirtualHost *:80>
    ServerName www.thelibraryofintegration.com
    DocumentRoot /var/www/sample


    ProxyPass /balancer-manager !

    <Proxy balancer://mycluster>
        BalancerMember http://100.66.52.69:80 route=backend1
        BalancerMember http://100.66.52.70:80 status=+H route=backend2
        ProxySet lbmethod=byrequests failonstatus=503
    </Proxy>

    ProxyPass / balancer://mycluster/
    ProxyPassReverse / balancer://mycluster/

    <Location /balancer-manager>
        SetHandler balancer-manager
        Require ip 127.0.0.1 100.66.52.0/24
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/sample_error.log
    CustomLog ${APACHE_LOG_DIR}/sample_access.log combined
</VirtualHost>

